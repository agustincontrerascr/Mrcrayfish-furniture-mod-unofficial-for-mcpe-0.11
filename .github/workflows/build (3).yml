name: Build APK
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Descargar NDK r10e (el que necesita este codigo: gnustl, GCC 4.9)
        run: |
          wget -q https://dl.google.com/android/repository/android-ndk-r10e-linux-x86_64.zip
          unzip -q android-ndk-r10e-linux-x86_64.zip
      - name: Compilar (ndk-build)
        run: ./android-ndk-r10e/ndk-build NDK_PROJECT_PATH=. APP_BUILD_SCRIPT=jni/Android.mk NDK_APPLICATION_MK=jni/Application.mk
      - name: Empaquetar y firmar APK
        run: python3 tools/make_apk.py
      - uses: actions/upload-artifact@v4
        with:
          name: CFM_Native_Ultimate_0.14.1_apk
          path: CFM_Native_Ultimate_0.14.1.apk
